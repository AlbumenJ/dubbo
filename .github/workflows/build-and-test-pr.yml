name: Build and Test For PR

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  FORK_COUNT: 2
  FAIL_FAST: 0
  SHOW_ERROR_DETAIL: 1
  #multi-version size limit
  VERSIONS_LIMIT: 4
  CANDIDATE_VERSIONS: '
    spring.version:4.3.30.RELEASE;
    spring-boot.version:1.5.22.RELEASE;
    spring-boot.version:2.4.1;
    '

jobs:
  integration-test-prepare:
    runs-on: ubuntu-20.04
    env:
      JOB_COUNT: 5
    steps:
      - uses: actions/checkout@v2
        with:
          repository: 'apache/dubbo-samples'
          ref: master
      - name: "Prepare test list"
        run: |
          bash ./test/scripts/prepare-test.sh
      - name: "Upload test list"
        uses: actions/upload-artifact@v2
        with:
          name: test-list
          path: test/jobs

  integration-test-job:
    needs: [integration-test-prepare]
    name: "Integration Test on ubuntu-20.04 (JobId: ${{matrix.job_id}})"
    runs-on: ubuntu-20.04
    timeout-minutes: 30
    env:
      JAVA_VER: 8
      TEST_CASE_FILE: jobs/testjob_${{matrix.job_id}}.txt
    strategy:
      fail-fast: false
      matrix:
        job_id: [2]
    steps:
      - uses: actions/checkout@v2
        with:
          repository: 'apache/dubbo-samples'
          ref: master
      - uses: actions/checkout@v2
        with:
          path: "./dubbo-project"
      - name: "Cache local Maven repository"
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
      - name: "Set up JDK 8"
        uses: actions/setup-java@v1
        with:
          java-version: 8
      - name: "Compile Dubbo"
        run: |
          cd ${{ github.workspace }}/dubbo-project
          ./mvnw --batch-mode --no-snapshot-updates -e --no-transfer-progress --fail-fast -T 2C clean install -DskipTests=true -DskipIntegrationTests=true -Dcheckstyle.skip=true -Dcheckstyle_unix.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true
      - name: "Calculate Dubbo Version"
        id: dubbo-version
        run: |
          DUBBO_VERSION=`awk '/<revision>[^<]+<\/revision>/{gsub(/<revision>|<\/revision>/,"",$1);print $1;exit;}' ./dubbo-project/pom.xml`
          CANDIDATE_VERSIONS="dubbo.version:$DUBBO_VERSION;compiler.version:$DUBBO_VERSION;$CANDIDATE_VERSIONS;dubbo.compiler.version:$DUBBO_VERSION"
          echo "CANDIDATE_VERSIONS=$CANDIDATE_VERSIONS" >> $GITHUB_ENV
      - name: "Download test list"
        uses: actions/download-artifact@v2
        with:
          name: test-list
          path: test/jobs/
      - name: "Build test image"
        run: |
          cd test && bash ./build-test-image.sh
      - name: "Run tests"
        run: cd test && bash ./run-tests.sh
      - name: "Upload test result"
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: test-result
          path: test/jobs/*-result*
      - name: "Pack Project Files"
        if: always()
        run: 7z a /tmp/project.zip ${{ github.workspace }}/* -r
      - name: "Upload Project Files"
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: "project-file"
          path: /tmp/project.zip
      - name: "Pack Maven"
        if: always()
        run: 7z a /tmp/maven.zip ~/.m2/* -r
      - name: "Upload Maven"
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: "maven-file"
          path: /tmp/maven.zip
      - name: "Pack Image"
        if: always()
        run: docker save dubbo/sample-test:8 | gzip > /tmp/samples-test.tar.gz
      - name: "Upload Image"
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: "samples-test-image"
          path: /tmp/samples-test.tar.gz

  integration-test-result:
    needs: [integration-test-job]
    if: always()
    runs-on: ubuntu-20.04
    env:
      JAVA_VER: 8
    steps:
      - uses: actions/checkout@v2
        with:
          repository: 'apache/dubbo-samples'
          ref: master
      - name: "Download test result"
        uses: actions/download-artifact@v2
        with:
          name: test-result
          path: test/jobs/
      - name: "Merge test result"
        run: ./test/scripts/merge-test-results.sh
